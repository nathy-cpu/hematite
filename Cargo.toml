[package]
name = "hematite-db"
version = "0.1.0"
edition = "2021"
description = "A small embeddable SQL database."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/hematite-db"
repository = "https://github.com/nathy-cpu/hematite"
keywords = ["database", "sql", "embedded", "storage"]
categories = ["database-implementations"]

[lib]
name = "hematite"
path = "src/lib.rs"

[[bin]]
name = "hematite_cli"
path = "src/main.rs"

[dependencies]

# The crate itself stays dependency-free. These are build-time only and are not
# visible to downstream consumers.
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[[bench]]
name = "storage_micro"
harness = false

[[bench]]
name = "storage_workloads"
harness = false

# Benchmarks are the project's measurement instrument, so they must be compiled the
# way a performance-sensitive embedder would compile the library.
[profile.release]
lto = "thin"
codegen-units = 1
